[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Exclude mock contracts and scripts from coverage reports
no_match_coverage = "mock|\\.s\\.sol$"
# Enable auto-detection for multiple Solidity versions
auto_detect_solc = true

[fmt]
tab_width = 2

[lint]
ignore = ["test/**/*"]


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
