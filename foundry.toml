[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Exclude mock contracts, scripts, PreLiquidation lib, and bytecode helpers from coverage reports
# This prevents double counting when using multi-compiler support
no_match_coverage = "mock|\\.s\\.sol$|lib/pre-liquidation|PreLiquidationBytecode"
# Lock compiler version to avoid floating pragma
solc_version = "0.8.33"
auto_detect_solc = false
# Ignore warnings from dependencies:
# 2424: Natspec memory-safe-assembly special comment deprecated
# 8429: Virtual modifiers deprecated
ignored_error_codes = [2424, 8429]

# Exclude invariant tests from default test runs (expensive, run separately)
no_match_test = "^invariant"

[profile.ci]
optimizer = true
optimizer_runs = 150

[profile.full]
# Run all tests including invariant tests: FOUNDRY_PROFILE=full forge test
no_match_test = "^$"

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
tab_width = 2

[lint]
ignore = ["test/**/*"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
